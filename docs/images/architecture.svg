<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>How the FPGA video AI works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>

  <!-- the board -->
  <rect x="150" y="16" width="660" height="396" rx="22" fill="none" stroke="#000" stroke-width="1.6"/>
  <text x="168" y="42" font-size="14" font-weight="700">Zybo Z7-10 board (FPGA + ARM CPU)</text>

  <!-- row 1: live video path -->
  <rect x="12" y="78" width="108" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="66" y="107" font-size="14" font-weight="700" text-anchor="middle">Laptop</text>
  <text x="66" y="125" font-size="11" text-anchor="middle">HDMI video</text>

  <rect x="172" y="78" width="112" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="228" y="107" font-size="14" font-weight="700" text-anchor="middle">HDMI in</text>
  <text x="228" y="125" font-size="11" text-anchor="middle">picture to pixels</text>

  <rect x="350" y="78" width="190" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="445" y="104" font-size="14" font-weight="700" text-anchor="middle">Draw the answer</text>
  <text x="445" y="122" font-size="11" text-anchor="middle">box, digit and bar on</text>
  <text x="445" y="135" font-size="11" text-anchor="middle">the live picture</text>

  <rect x="606" y="78" width="112" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="662" y="107" font-size="14" font-weight="700" text-anchor="middle">HDMI out</text>
  <text x="662" y="125" font-size="11" text-anchor="middle">pixels to picture</text>

  <rect x="840" y="78" width="108" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="894" y="107" font-size="14" font-weight="700" text-anchor="middle">TV</text>
  <text x="894" y="125" font-size="11" text-anchor="middle">picture + answer</text>

  <line x1="120" y1="110" x2="170" y2="110" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="284" y1="110" x2="348" y2="110" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="110" x2="604" y2="110" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="718" y1="110" x2="838" y2="110" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="445" y="66" font-size="11" text-anchor="middle">Video never waits: 94 ns delay, no frame buffer, 60 frames per second</text>

  <!-- row 2: the AI -->
  <rect x="172" y="236" width="180" height="76" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="262" y="262" font-size="14" font-weight="700" text-anchor="middle">1. Look at the box</text>
  <text x="262" y="281" font-size="11" text-anchor="middle">crop the middle, make it</text>
  <text x="262" y="295" font-size="11" text-anchor="middle">gray and shrink to 28 x 28</text>

  <rect x="398" y="236" width="180" height="76" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="488" y="262" font-size="14" font-weight="700" text-anchor="middle">2. Neural network</text>
  <text x="488" y="281" font-size="11" text-anchor="middle">hand-written SystemVerilog</text>
  <text x="488" y="295" font-size="11" text-anchor="middle">240 microseconds per image</text>

  <rect x="624" y="236" width="164" height="76" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="706" y="262" font-size="14" font-weight="700" text-anchor="middle">3. Answer</text>
  <text x="706" y="281" font-size="11" text-anchor="middle">digit 0 to 9 and</text>
  <text x="706" y="295" font-size="11" text-anchor="middle">how sure it is</text>

  <line x1="352" y1="274" x2="396" y2="274" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="578" y1="274" x2="622" y2="274" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- copy of the pixels goes down to step 1 -->
  <polyline points="228,142 228,236" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="238" y="196" font-size="11">same pixels</text>

  <!-- answer goes back to the overlay -->
  <polyline points="706,236 706,190 445,190 445,144" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="575" y="182" font-size="11" text-anchor="middle">answer is drawn on the next frame</text>

  <!-- ARM -->
  <rect x="398" y="338" width="180" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <text x="488" y="362" font-size="14" font-weight="700" text-anchor="middle">ARM CPU</text>
  <text x="488" y="380" font-size="11" text-anchor="middle">settings, tests, text output</text>
  <line x1="488" y1="338" x2="488" y2="314" stroke="#000" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="480" y="440" font-size="11" text-anchor="middle">The video side runs at 74.25 MHz and the network side at 100 MHz. Every crossing between them is synchronized (docs/CDC.md).</text>
  <text x="480" y="458" font-size="11" text-anchor="middle">Board: Digilent Zybo Z7-10 (XC7Z010). Tools: Vivado and Vitis 2025.1.</text>
</svg>
